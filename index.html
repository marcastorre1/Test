<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сферум — всё для учёбы</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #ffffff;
            --bg-soft: #f7f5ff;
            --text: #1a1a2e;
            --muted: #6b6b80;
            --violet: #7c3aed;
            --violet-light: #a78bfa;
            --violet-dark: #5b21b6;
            --pink: #ec4899;
            --blue: #3b82f6;
            --border: rgba(124,58,237,0.1);
            --shadow: 0 10px 40px rgba(124,58,237,0.08);
            --shadow-hover: 0 20px 60px rgba(124,58,237,0.15);
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ============================================
           АНИМАЦИИ
           ============================================ */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes floatY {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-15px); }
        }
        @keyframes floatY2 {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-10px); }
        }
        @keyframes rotateBall {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }
        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50%      { background-position: 100% 50%; }
        }
        @keyframes glowPulse {
            0%, 100% { box-shadow: 0 0 30px rgba(124,58,237,0.3); }
            50%      { box-shadow: 0 0 60px rgba(124,58,237,0.5); }
        }

        /* ============================================
           ХЕДЕР
           ============================================ */
        .header {
            position: sticky; top: 0; z-index: 100;
            padding: 14px 20px;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
        }
        .logo {
            display: flex; align-items: center; gap: 8px;
            font-size: 16px;
            font-weight: 800;
            color: var(--text);
            letter-spacing: -0.3px;
        }
        .logo-icon {
            width: 24px; height: 24px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--violet) 0%, var(--pink) 100%);
            position: relative;
        }
        .logo-icon::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 10px; height: 10px;
            border-radius: 50%;
            background: #fff;
            opacity: 0.9;
        }
        .nav {
            display: none;
            gap: 24px;
            font-size: 12px;
            font-weight: 500;
            color: var(--muted);
        }
        .nav a {
            color: var(--muted);
            text-decoration: none;
            transition: color 0.2s;
        }
        .nav a:hover { color: var(--violet); }
        .header-actions {
            display: flex; gap: 10px; align-items: center;
        }
        .btn-ghost {
            background: transparent;
            border: 1px solid var(--border);
            padding: 8px 16px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text);
            border-radius: 100px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.3s;
        }
        .btn-ghost:hover { border-color: var(--violet); color: var(--violet); }
        .btn-violet {
            background: linear-gradient(135deg, var(--violet) 0%, var(--pink) 100%);
            border: none;
            padding: 10px 18px;
            font-size: 11px;
            font-weight: 600;
            color: #fff;
            border-radius: 100px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.3s;
            box-shadow: 0 4px 16px rgba(124,58,237,0.3);
        }
        .btn-violet:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(124,58,237,0.4);
        }

        /* ============================================
           HERO
           ============================================ */
        .hero {
            position: relative;
            background: linear-gradient(135deg, #8b5cf6 0%, #a855f7 50%, #d946ef 100%);
            padding: 60px 20px 80px;
            overflow: hidden;
            border-radius: 0 0 40px 40px;
            margin-bottom: -40px;
        }
        /* Сферы на фоне hero */
        .hero-bg {
            position: absolute; inset: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .hero-sphere {
            position: absolute;
            border-radius: 50%;
            opacity: 0.6;
            filter: blur(1px);
        }
        .hero-sphere.s1 {
            top: 10%; right: 5%;
            width: 120px; height: 120px;
            background: radial-gradient(circle at 30% 30%, #c4b5fd 0%, #7c3aed 60%, #4c1d95 100%);
            animation: floatY 6s ease-in-out infinite;
            box-shadow: 0 20px 60px rgba(76,29,149,0.4);
        }
        .hero-sphere.s2 {
            top: 45%; left: 3%;
            width: 80px; height: 80px;
            background: radial-gradient(circle at 30% 30%, #a5b4fc 0%, #3b82f6 60%, #1e40af 100%);
            animation: floatY2 7s ease-in-out infinite;
            box-shadow: 0 15px 40px rgba(59,130,246,0.4);
        }
        .hero-sphere.s3 {
            bottom: 15%; right: 15%;
            width: 60px; height: 60px;
            background: radial-gradient(circle at 30% 30%, #f9a8d4 0%, #ec4899 60%, #9d174d 100%);
            animation: floatY 8s ease-in-out infinite;
            box-shadow: 0 15px 40px rgba(236,72,153,0.4);
        }
        .hero-sphere.s4 {
            top: 20%; left: 15%;
            width: 40px; height: 40px;
            background: radial-gradient(circle at 30% 30%, #fde68a 0%, #f59e0b 100%);
            animation: floatY2 5s ease-in-out infinite;
            opacity: 0.5;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
        }
        .hero h1 {
            font-size: clamp(28px, 7vw, 48px);
            font-weight: 800;
            color: #fff;
            letter-spacing: -1px;
            line-height: 1.15;
            margin-bottom: 20px;
            animation: fadeUp 0.8s ease 0.1s both;
        }
        .hero-sub {
            font-size: clamp(13px, 3.5vw, 16px);
            color: rgba(255,255,255,0.85);
            line-height: 1.6;
            margin-bottom: 32px;
            animation: fadeUp 0.8s ease 0.3s both;
        }
        .hero-buttons {
            display: flex; flex-wrap: wrap; gap: 12px;
            justify-content: center;
            margin-bottom: 40px;
            animation: fadeUp 0.8s ease 0.5s both;
        }
        .btn-white {
            background: #fff;
            color: var(--violet);
            border: none;
            padding: 14px 24px;
            font-size: 12px;
            font-weight: 700;
            border-radius: 100px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.3s;
        }
        .btn-white:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .btn-outline-white {
            background: transparent;
            color: #fff;
            border: 1px solid rgba(255,255,255,0.5);
            padding: 14px 24px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 100px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.3s;
        }
        .btn-outline-white:hover {
            background: rgba(255,255,255,0.15);
            border-color: #fff;
        }

        /* Мокап с расписанием */
        .hero-mockup {
            position: relative;
            z-index: 2;
            max-width: 700px;
            margin: 0 auto;
            background: #fff;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.25);
            animation: fadeUp 1s ease 0.7s both;
        }
        .mockup-header {
            display: flex; align-items: center; gap: 12px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 14px;
        }
        .mockup-back {
            width: 28px; height: 28px;
            border-radius: 50%;
            background: var(--bg-soft);
            display: flex; align-items: center; justify-content: center;
            color: var(--violet);
            font-size: 14px;
            cursor: pointer;
        }
        .mockup-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
        }
        .mockup-calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            margin-bottom: 14px;
        }
        .cal-day {
            text-align: center;
            padding: 8px 4px;
            font-size: 11px;
            font-weight: 600;
            border-radius: 8px;
            color: var(--muted);
            background: var(--bg-soft);
        }
        .cal-day.active {
            background: linear-gradient(135deg, var(--violet), var(--pink));
            color: #fff;
            box-shadow: 0 4px 12px rgba(124,58,237,0.3);
        }
        .mockup-info {
            display: flex; flex-direction: column; gap: 8px;
        }
        .mockup-row {
            display: flex; align-items: center; gap: 10px;
            font-size: 12px;
            color: var(--muted);
            padding: 8px 12px;
            background: var(--bg-soft);
            border-radius: 10px;
        }
        .mockup-row strong { color: var(--text); font-weight: 600; }

        /* ============================================
           СЕКЦИИ
           ============================================ */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .section {
            padding: 70px 0;
        }
        .section-title {
            font-size: clamp(22px, 5.5vw, 32px);
            font-weight: 800;
            text-align: center;
            letter-spacing: -0.8px;
            color: var(--text);
            margin-bottom: 12px;
        }
        .section-sub {
            font-size: 14px;
            color: var(--muted);
            text-align: center;
            max-width: 600px;
            margin: 0 auto 40px;
            line-height: 1.6;
        }

        /* Карточки ролей */
        .roles-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 14px;
        }
        .role-card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px 20px;
            text-align: center;
            transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            box-shadow: var(--shadow);
        }
        .role-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-hover);
            border-color: var(--violet-light);
        }
        .role-icon {
            width: 56px; height: 56px;
            border-radius: 16px;
            margin: 0 auto 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px;
            position: relative;
        }
        .role-icon.purple {
            background: linear-gradient(135deg, #ddd6fe 0%, #c4b5fd 100%);
            box-shadow: 0 8px 20px rgba(167,139,250,0.3);
        }
        .role-icon.pink {
            background: linear-gradient(135deg, #fbcfe8 0%, #f9a8d4 100%);
            box-shadow: 0 8px 20px rgba(249,168,212,0.3);
        }
        .role-icon.blue {
            background: linear-gradient(135deg, #bfdbfe 0%, #93c5fd 100%);
            box-shadow: 0 8px 20px rgba(147,197,253,0.3);
        }
        .role-icon.green {
            background: linear-gradient(135deg, #bbf7d0 0%, #86efac 100%);
            box-shadow: 0 8px 20px rgba(134,239,172,0.3);
        }
        .role-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 8px;
        }
        .role-desc {
            font-size: 12px;
            color: var(--muted);
            line-height: 1.6;
        }

        /* Шаги */
        .steps-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 14px;
        }
        .step-card {
            background: linear-gradient(135deg, #faf5ff 0%, #f3e8ff 100%);
            border-radius: 20px;
            padding: 24px 20px;
            text-align: center;
            border: 1px solid var(--border);
            transition: all 0.4s;
        }
        .step-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-hover);
        }
        .step-num {
            display: inline-block;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--violet);
            background: #fff;
            padding: 4px 12px;
            border-radius: 100px;
            margin-bottom: 14px;
        }
        .step-ball {
            width: 60px; height: 60px;
            border-radius: 50%;
            margin: 0 auto 14px;
            animation: floatY 4s ease-in-out infinite;
        }
        .step-ball.b1 {
            background: radial-gradient(circle at 30% 30%, #c4b5fd 0%, #7c3aed 60%, #4c1d95 100%);
            box-shadow: 0 10px 30px rgba(124,58,237,0.3);
        }
        .step-ball.b2 {
            background: radial-gradient(circle at 30% 30%, #f9a8d4 0%, #ec4899 60%, #9d174d 100%);
            box-shadow: 0 10px 30px rgba(236,72,153,0.3);
            animation-delay: 0.5s;
        }
        .step-ball.b3 {
            background: radial-gradient(circle at 30% 30%, #a5b4fc 0%, #3b82f6 60%, #1e40af 100%);
            box-shadow: 0 10px 30px rgba(59,130,246,0.3);
            animation-delay: 1s;
        }
        .step-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 8px;
        }
        .step-desc {
            font-size: 12px;
            color: var(--muted);
            line-height: 1.6;
            margin-bottom: 14px;
        }
        .step-link {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            color: var(--violet);
            text-decoration: none;
            padding: 8px 20px;
            border-radius: 100px;
            background: #fff;
            transition: all 0.3s;
        }
        .step-link:hover {
            background: var(--violet);
            color: #fff;
        }

        /* Доверие */
        .trust-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 14px;
        }
        .trust-card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 22px 20px;
            box-shadow: var(--shadow);
            transition: all 0.3s;
        }
        .trust-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
        }
        .trust-icon {
            font-size: 22px;
            margin-bottom: 12px;
        }
        .trust-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 8px;
        }
        .trust-desc {
            font-size: 12px;
            color: var(--muted);
            line-height: 1.6;
        }
        .trust-desc ul {
            list-style: none;
            margin-top: 8px;
        }
        .trust-desc li {
            padding: 3px 0;
            padding-left: 16px;
            position: relative;
            font-size: 12px;
        }
        .trust-desc li::before {
            content: '◆';
            position: absolute;
            left: 0;
            color: var(--violet);
            font-size: 8px;
            top: 7px;
        }
        .trust-highlight {
            background: linear-gradient(135deg, var(--violet) 0%, var(--pink) 100%);
            color: #fff;
            border: none;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .trust-highlight .big-num {
            font-size: 40px;
            font-weight: 900;
            letter-spacing: -2px;
            margin-bottom: 4px;
        }
        .trust-highlight .big-label {
            font-size: 13px;
            opacity: 0.9;
            margin-bottom: 12px;
        }
        .trust-highlight .big-desc {
            font-size: 11px;
            opacity: 0.8;
            line-height: 1.5;
        }
        .trust-org {
            background: linear-gradient(135deg, #faf5ff 0%, #ede9fe 100%);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            position: relative;
            overflow: hidden;
        }
        .trust-org-text {
            flex: 1;
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            line-height: 1.5;
        }
        .trust-org-sphere {
            width: 70px; height: 70px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #c4b5fd 0%, #7c3aed 60%, #4c1d95 100%);
            box-shadow: 0 10px 30px rgba(124,58,237,0.3);
            flex-shrink: 0;
            animation: floatY 5s ease-in-out infinite;
        }

        /* Где узнать */
        .learn-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 14px;
        }
        .learn-card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 20px;
            box-shadow: var(--shadow);
            transition: all 0.3s;
            cursor: pointer;
        }
        .learn-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-hover);
        }
        .learn-visual {
            width: 100%;
            aspect-ratio: 1.5;
            border-radius: 14px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .learn-visual.v1 {
            background: linear-gradient(135deg, #ddd6fe 0%, #c4b5fd 100%);
        }
        .learn-visual.v2 {
            background: linear-gradient(135deg, #fbcfe8 0%, #f9a8d4 100%);
        }
        .learn-visual.v3 {
            background:
