<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pitelicik — веб-разработка</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #08080d;
            --bg-soft: #0e0e18;
            --card: #121220;
            --text: #f5f5fa;
            --muted: #7a7a8c;
            --violet: #8b5cf6;
            --violet-light: #a78bfa;
            --violet-dark: #6d28d9;
            --pink: #ec4899;
            --cyan: #06b6d4;
            --border: rgba(139,92,246,0.15);
            --border-soft: rgba(255,255,255,0.06);
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 80px;
            -webkit-font-smoothing: antialiased;
            position: relative;
        }

        /* Фиолетовое свечение на фоне */
        body::before {
            content: '';
            position: fixed;
            top: -20%; left: 50%;
            transform: translateX(-50%);
            width: 900px; height: 900px;
            background: radial-gradient(circle, rgba(139,92,246,0.12) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
            filter: blur(60px);
        }

        /* ============================================
           АНИМАЦИИ
           ============================================ */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }
        @keyframes floatY {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-12px); }
        }
        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50%      { background-position: 100% 50%; }
        }
        @keyframes glowPulse {
            0%, 100% { box-shadow: 0 0 30px rgba(139,92,246,0.3); }
            50%      { box-shadow: 0 0 60px rgba(139,92,246,0.5); }
        }
        @keyframes rotateSlow {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }
        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to   { transform: translateY(0); opacity: 1; }
        }
        @keyframes marquee {
            from { transform: translateX(0); }
            to   { transform: translateX(-50%); }
        }

        /* ============================================
           ХЕДЕР
           ============================================ */
        .header {
            position: sticky; top: 0; z-index: 100;
            padding: 16px 20px;
            background: rgba(8,8,13,0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-soft);
            display: flex; align-items: center; justify-content: space-between;
        }
        .logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #fff 0%, var(--violet-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .nav {
            display: none;
            gap: 24px;
            font-size: 12px;
            font-weight: 500;
        }
        .nav a {
            color: var(--muted);
            text-decoration: none;
            transition: color 0.2s;
        }
        .nav a:hover { color: var(--violet-light); }
        .header-btn {
            background: linear-gradient(135deg, var(--violet), var(--pink));
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-radius: 100px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.3s;
            box-shadow: 0 4px 16px rgba(139,92,246,0.3);
        }
        .header-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(139,92,246,0.5);
        }

        /* ============================================
           HERO
           ============================================ */
        .hero {
            padding: 80px 20px 60px;
            position: relative;
            z-index: 2;
            max-width: 1100px;
            margin: 0 auto;
            text-align: center;
        }
        .hero-avatar {
            width: 90px; height: 90px;
            border-radius: 50%;
            margin: 0 auto 24px;
            background: linear-gradient(135deg, var(--violet), var(--pink));
            display: flex; align-items: center; justify-content: center;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 32px;
            font-weight: 700;
            color: #fff;
            box-shadow: 0 10px 40px rgba(139,92,246,0.4);
            animation: floatY 4s ease-in-out infinite;
        }
        .hero-eyebrow {
            display: inline-block;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--violet-light);
            border: 1px solid var(--border);
            padding: 6px 16px;
            border-radius: 100px;
            margin-bottom: 22px;
            animation: fadeUp 0.8s ease 0.1s both;
        }
        .hero h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(34px, 9vw, 62px);
            font-weight: 700;
            letter-spacing: -2px;
            line-height: 1.05;
            margin-bottom: 22px;
            animation: fadeUp 0.8s ease 0.2s both;
        }
        .hero h1 .gradient {
            background: linear-gradient(135deg, var(--violet-light) 0%, var(--pink) 50%, var(--cyan) 100%);
            background-size: 200% 200%;
            animation: gradientShift 5s ease infinite;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .hero h1 .italic {
            font-style: italic;
            font-weight: 300;
            color: var(--muted);
        }
        .hero-desc {
            font-size: clamp(14px, 3.5vw, 16px);
            color: var(--muted);
            line-height: 1.7;
            max-width: 620px;
            margin: 0 auto 32px;
            animation: fadeUp 0.8s ease 0.4s both;
        }
        .hero-actions {
            display: flex; flex-wrap: wrap; gap: 12px;
            justify-content: center;
            margin-bottom: 32px;
            animation: fadeUp 0.8s ease 0.6s both;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--violet), var(--pink));
            color: #fff;
            border: none;
            padding: 15px 30px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-radius: 100px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.3s;
            box-shadow: 0 6px 24px rgba(139,92,246,0.4);
        }
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 32px rgba(139,92,246,0.6);
        }
        .btn-outline {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--border);
            padding: 15px 30px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-radius: 100px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.3s;
        }
        .btn-outline:hover {
            border-color: var(--violet);
            color: var(--violet-light);
            background: rgba(139,92,246,0.05);
        }
        .hero-meta {
            display: flex; justify-content: center; gap: 24px;
            font-size: 11px;
            color: var(--muted);
            letter-spacing: 1px;
            text-transform: uppercase;
            animation: fadeUp 0.8s ease 0.8s both;
        }
        .hero-meta span {
            display: flex; align-items: center; gap: 6px;
        }
        .hero-meta .dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--violet);
            box-shadow: 0 0 8px var(--violet);
            animation: glowPulse 2s ease-in-out infinite;
        }

        /* Бегущая строка */
        .marquee-wrap {
            overflow: hidden;
            padding: 24px 0;
            border-top: 1px solid var(--border-soft);
            border-bottom: 1px solid var(--border-soft);
            margin: 20px 0 0;
            position: relative;
            z-index: 2;
        }
        .marquee {
            display: flex;
            gap: 50px;
            animation: marquee 30s linear infinite;
            white-space: nowrap;
        }
        .marquee span {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 3px;
            color: var(--muted);
            text-transform: uppercase;
        }
        .marquee span::before {
            content: '◆ ';
            color: var(--violet);
        }

        /* ============================================
           СЕКЦИИ
           ============================================ */
        .section {
            padding: 70px 20px;
            max-width: 1100px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }
        .section-tag {
            display: inline-block;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--violet-light);
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: 100px;
            margin-bottom: 18px;
        }
        .section h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(28px, 6.5vw, 44px);
            font-weight: 700;
            line-height: 1.05;
            letter-spacing: -1.5px;
            margin-bottom: 16px;
        }
        .section h2 .gradient {
            background: linear-gradient(135deg, var(--violet-light) 0%, var(--pink) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .section-desc {
            font-size: 14px;
            line-height: 1.7;
            color: var(--muted);
            max-width: 600px;
            margin-bottom: 40px;
        }

        /* УСЛУГИ */
        .services-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }
        .service-card {
            background: var(--card);
            border: 1px solid var(--border-soft);
            border-radius: 20px;
            padding: 28px 24px;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .service-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at top left, rgba(139,92,246,0.12) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.4s;
        }
        .service-card:hover {
            border-color: var(--border);
            transform: translateY(-6px);
            box-shadow: 0 20px 50px rgba(139,92,246,0.15);
        }
        .service-card:hover::before { opacity: 1; }
        .service-icon {
            width: 52px; height: 52px;
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px;
            margin-bottom: 18px;
            background: linear-gradient(135deg, rgba(139,92,246,0.2) 0%, rgba(236,72,153,0.15) 100%);
            border: 1px solid var(--border);
            position: relative;
            z-index: 1;
        }
        .service-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
        }
        .service-desc {
            font-size: 13px;
            line-height: 1.6;
            color: var(--muted);
            position: relative;
            z-index: 1;
        }
        .service-list {
            list-style: none;
            margin-top: 14px;
            position: relative;
            z-index: 1;
        }
        .service-list li {
            font-size: 12px;
            color: var(--muted);
            padding: 3px 0;
            padding-left: 16px;
            position: relative;
        }
        .service-list li::before {
            content: '◆';
            position: absolute;
            left: 0;
            color: var(--violet);
            font-size: 7px;
            top: 7px;
        }

        /* РАБОТЫ */
        .works-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }
        .work-card {
            background: var(--card);
            border: 1px solid var(--border-soft);
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            cursor: pointer;
        }
        .work-card:hover {
            transform: translateY(-8px);
            border-color: var(--border);
            box-shadow: 0 25px 60px rgba(139,92,246,0.2);
        }
        .work-preview {
            aspect-ratio: 16 / 10;
            background: linear-gradient(135deg, #1a1a2e 0%, #2d1b4e 100%);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .work-preview::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 30% 30%, rgba(139,92,246,0.4) 0%, transparent 50%),
                radial-gradient(circle at 70% 70%, rgba(236,72,153,0.3) 0%, transparent 50%);
            opacity: 0.7;
        }
        .work-preview-mockup {
            width: 70%;
            height: 65%;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            position: relative;
            z-index: 1;
            backdrop-filter: blur(10px);
            padding: 12px;
        }
        .mockup-bar {
            display: flex; gap: 4px;
            margin-bottom: 10px;
        }
        .mockup-bar span {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
        }
        .mockup-bar span:nth-child(1) { background: #ff5f57; }
        .mockup-bar span:nth-child(2) { background: #febc2e; }
        .mockup-bar span:nth-child(3) { background: #28c840; }
        .mockup-line {
            height: 6px;
            background: rgba(255,255,255,0.15);
            border-radius: 3px;
            margin-bottom: 6px;
        }
        .mockup-line.short { width: 60%; }
        .mockup-line.tiny { width: 40%; }
        .mockup-block {
            height: 40px;
            background: linear-gradient(135deg, rgba(139,92,246,0.4) 0%, rgba(236,72,153,0.3) 100%);
            border-radius: 6px;
            margin-top: 10px;
        }
        .work-info {
            padding: 20px;
        }
        .work-category {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--violet-light);
            margin-bottom: 8px;
        }
        .work-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .work-desc {
            font-size: 13px;
            color: var(--muted);
            line-height: 1.6;
            margin-bottom: 14px;
        }
        .work-tags {
            display: flex; flex-wrap: wrap; gap: 6px;
        }
        .work-tag {
            font-size: 10px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 100px;
            background: rgba(139,92,246,0.1);
            color: var(--violet-light);
            border: 1px solid var(--border);
            letter-spacing: 0.5px;
        }

        /* ПРОЦЕСС */
        .process-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }
        .process-card {
            background: var(--card);
            border: 1px solid var(--border-soft);
            border-radius: 18px;
            padding: 24px 22px;
            position: relative;
            transition: all 0.3s;
        }
        .process-card:hover {
            border-color: var(--border);
            transform: translateY(-4px);
        }
        .process-num {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 42px;
            font-weight: 700;
            line-height: 1;
            background: linear-gradient(135deg, var(--violet-light) 0%, var(--violet-dark) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 14px;
            opacity: 0.9;
        }
        .process-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .process-desc {
            font-size: 12px;
            color: var(--muted);
            line-height: 1.6;
        }

        /* СТАТИСТИКА */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-top: 30px;
        }
        .stat-card {
            background: var(--card);
            border: 1px solid var(--border-soft);
            border-radius: 18px;
            padding: 24px 20px;
            text-align: center;
            transition: all 0.3s;
        }
        .stat-card:hover {
            border-color: var(--border);
            transform: translateY(-3px);
        }
        .stat-value {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #fff 0%, var(--violet-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 4px;
        }
        .stat-label {
            font-size: 10px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--muted);
        }

        /* ЦЕНЫ */
        .pricing-grid {
            display: grid;
