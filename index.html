<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEAR — одежда с характером</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #ffffff;
            --bg-soft: #faf5ff;
            --text: #1a1a2e;
            --muted: #6b6b80;
            --violet: #7c3aed;
            --violet-light: #a78bfa;
            --pink: #ec4899;
            --border: rgba(124,58,237,0.1);
            --shadow: 0 10px 40px rgba(124,58,237,0.08);
            --shadow-hover: 0 20px 60px rgba(124,58,237,0.15);
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 90px;
            -webkit-font-smoothing: antialiased;
        }

        /* ============================================
           АНИМАЦИИ
           ============================================ */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes floatY {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-15px); }
        }
        @keyframes floatY2 {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-10px); }
        }
        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50%      { background-position: 100% 50%; }
        }
        @keyframes badgePop {
            0%   { transform: scale(1); }
            50%  { transform: scale(1.4); }
            100% { transform: scale(1); }
        }
        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to   { transform: translateY(0); opacity: 1; }
        }

        /* ============================================
           ХЕДЕР
           ============================================ */
        .header {
            position: sticky; top: 0; z-index: 100;
            padding: 14px 20px;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
        }
        .logo {
            display: flex; align-items: center; gap: 8px;
            font-size: 16px;
            font-weight: 800;
            color: var(--text);
            letter-spacing: -0.3px;
        }
        .logo-icon {
            width: 24px; height: 24px;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--violet) 0%, var(--pink) 100%);
            position: relative;
        }
        .logo-icon::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 8px; height: 8px;
            border-radius: 2px;
            background: #fff;
        }
        .nav {
            display: none;
            gap: 24px;
            font-size: 12px;
            font-weight: 500;
        }
        .nav a {
            color: var(--muted);
            text-decoration: none;
            transition: color 0.2s;
        }
        .nav a:hover { color: var(--violet); }
        .cart-icon-wrap {
            position: relative;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border-radius: 100px;
            border: 1px solid var(--border);
            transition: all 0.3s;
        }
        .cart-icon-wrap:hover {
            border-color: var(--violet);
            color: var(--violet);
        }
        .cart-icon-wrap svg {
            width: 18px; height: 18px;
            stroke: currentColor; fill: none; stroke-width: 1.8;
        }
        .cart-icon-wrap span {
            font-size: 12px;
            font-weight: 600;
        }
        .cart-badge {
            position: absolute;
            top: -6px; right: -6px;
            background: linear-gradient(135deg, var(--violet), var(--pink));
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            min-width: 18px; height: 18px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            padding: 0 4px;
        }
        .cart-badge.pop { animation: badgePop 0.4s ease; }

        /* ============================================
           HERO
           ============================================ */
        .hero {
            position: relative;
            background: linear-gradient(135deg, #8b5cf6 0%, #a855f7 50%, #d946ef 100%);
            background-size: 200% 200%;
            animation: gradientShift 8s ease infinite;
            padding: 60px 20px 90px;
            overflow: hidden;
            border-radius: 0 0 40px 40px;
            margin-bottom: 40px;
        }
        .hero-bg {
            position: absolute; inset: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .hero-sphere {
            position: absolute;
            border-radius: 50%;
            opacity: 0.55;
        }
        .hero-sphere.s1 {
            top: 8%; right: 5%;
            width: 140px; height: 140px;
            background: radial-gradient(circle at 30% 30%, #fbcfe8 0%, #ec4899 60%, #9d174d 100%);
            animation: floatY 6s ease-in-out infinite;
            box-shadow: 0 20px 60px rgba(236,72,153,0.4);
        }
        .hero-sphere.s2 {
            top: 50%; left: 3%;
            width: 90px; height: 90px;
            background: radial-gradient(circle at 30% 30%, #c4b5fd 0%, #7c3aed 60%, #4c1d95 100%);
            animation: floatY2 7s ease-in-out infinite;
            box-shadow: 0 15px 40px rgba(124,58,237,0.4);
        }
        .hero-sphere.s3 {
            bottom: 10%; right: 20%;
            width: 60px; height: 60px;
            background: radial-gradient(circle at 30% 30%, #fde68a 0%, #f59e0b 100%);
            animation: floatY 8s ease-in-out infinite;
            opacity: 0.6;
        }
        .hero-sphere.s4 {
            top: 15%; left: 20%;
            width: 40px; height: 40px;
            background: radial-gradient(circle at 30% 30%, #bfdbfe 0%, #3b82f6 100%);
            animation: floatY2 5s ease-in-out infinite;
            opacity: 0.5;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            text-align: center;
            max-width: 700px;
            margin: 0 auto;
        }
        .hero-eyebrow {
            display: inline-block;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.9);
            border: 1px solid rgba(255,255,255,0.4);
            padding: 6px 16px;
            border-radius: 100px;
            margin-bottom: 24px;
            animation: fadeUp 0.8s ease 0.1s both;
        }
        .hero h1 {
            font-size: clamp(32px, 8vw, 56px);
            font-weight: 900;
            color: #fff;
            letter-spacing: -1.5px;
            line-height: 1.05;
            margin-bottom: 20px;
            animation: fadeUp 0.8s ease 0.2s both;
        }
        .hero h1 span {
            font-style: italic;
            font-weight: 300;
        }
        .hero-sub {
            font-size: clamp(13px, 3.5vw, 16px);
            color: rgba(255,255,255,0.85);
            line-height: 1.6;
            margin-bottom: 32px;
            animation: fadeUp 0.8s ease 0.4s both;
        }
        .hero-buttons {
            display: flex; flex-wrap: wrap; gap: 12px;
            justify-content: center;
            animation: fadeUp 0.8s ease 0.6s both;
        }
        .btn-white {
            background: #fff;
            color: var(--violet);
            border: none;
            padding: 14px 28px;
            font-size: 12px;
            font-weight: 700;
            border-radius: 100px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-white:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .btn-outline-white {
            background: transparent;
            color: #fff;
            border: 1px solid rgba(255,255,255,0.5);
            padding: 14px 28px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 100px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-outline-white:hover {
            background: rgba(255,255,255,0.15);
            border-color: #fff;
        }

        /* ============================================
           СЕКЦИИ
           ============================================ */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .section {
            padding: 50px 0;
        }
        .section-title {
            font-size: clamp(22px, 5.5vw, 32px);
            font-weight: 800;
            text-align: center;
            letter-spacing: -0.8px;
            color: var(--text);
            margin-bottom: 12px;
        }
        .section-sub {
            font-size: 14px;
            color: var(--muted);
            text-align: center;
            max-width: 600px;
            margin: 0 auto 40px;
            line-height: 1.6;
        }

        /* КАТЕГОРИИ */
        .roles-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 14px;
        }
        .role-card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px 20px;
            text-align: center;
            transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            box-shadow: var(--shadow);
            cursor: pointer;
        }
        .role-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-hover);
            border-color: var(--violet-light);
        }
        .role-icon {
            width: 64px; height: 64px;
            border-radius: 18px;
            margin: 0 auto 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: 28px;
        }
        .role-icon.purple { background: linear-gradient(135deg, #ddd6fe 0%, #c4b5fd 100%); }
        .role-icon.pink { background: linear-gradient(135deg, #fbcfe8 0%, #f9a8d4 100%); }
        .role-icon.blue { background: linear-gradient(135deg, #bfdbfe 0%, #93c5fd 100%); }
        .role-icon.green { background: linear-gradient(135deg, #bbf7d0 0%, #86efac 100%); }
        .role-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 6px;
        }
        .role-desc {
            font-size: 12px;
            color: var(--muted);
            line-height: 1.5;
        }

        /* ШАГИ */
        .steps-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 14px;
        }
        .step-card {
            background: linear-gradient(135deg, #faf5ff 0%, #f3e8ff 100%);
            border-radius: 20px;
            padding: 24px 20px;
            text-align: center;
            border: 1px solid var(--border);
            transition: all 0.4s;
        }
        .step-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-hover);
        }
        .step-num {
            display: inline-block;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--violet);
            background: #fff;
            padding: 4px 12px;
            border-radius: 100px;
            margin-bottom: 14px;
        }
        .step-ball {
            width: 64px; height: 64px;
            border-radius: 50%;
            margin: 0 auto 14px;
            animation: floatY 4s ease-in-out infinite;
        }
        .step-ball.b1 {
            background: radial-gradient(circle at 30% 30%, #c4b5fd 0%, #7c3aed 60%, #4c1d95 100%);
            box-shadow: 0 10px 30px rgba(124,58,237,0.3);
        }
        .step-ball.b2 {
            background: radial-gradient(circle at 30% 30%, #f9a8d4 0%, #ec4899 60%, #9d174d 100%);
            box-shadow: 0 10px 30px rgba(236,72,153,0.3);
            animation-delay: 0.5s;
        }
        .step-ball.b3 {
            background: radial-gradient(circle at 30% 30%, #a5b4fc 0%, #3b82f6 60%, #1e40af 100%);
            box-shadow: 0 10px 30px rgba(59,130,246,0.3);
            animation-delay: 1s;
        }
        .step-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 8px;
        }
        .step-desc {
            font-size: 12px;
            color: var(--muted);
            line-height: 1.6;
        }

        /* БЛОК ДОВЕРИЯ */
        .trust-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 14px;
        }
        .trust-card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 22px 20px;
            box-shadow: var(--shadow);
            transition: all 0.3s;
        }
        .trust-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
        }
        .trust-icon {
            font-size: 24px;
            margin-bottom: 12px;
        }
        .trust-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 8px;
        }
        .trust-desc {
            font-size: 12px;
            color: var(--muted);
            line-height: 1.6;
        }
        .trust-highlight {
            background: linear-gradient(135deg, var(--violet) 0%, var(--pink) 100%);
            color: #fff;
            border: none;
            text-align: center;
        }
        .trust-highlight .big-num {
            font-size: 38px;
            font-weight: 900;
            letter-spacing: -2px;
            margin-bottom: 4px;
        }
        .trust-highlight .big-label {
            font-size: 12px;
            opacity: 0.9;
            margin-bottom: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .trust-highlight .big-desc {
            font-size: 11px;
            opacity: 0.85;
            line-height: 1.5;
        }

        /* КАТАЛОГ */
        .products-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }
        .product-card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 18px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            box-shadow: var(--shadow);
            cursor: pointer;
            animation: fadeUp 0.6s ease both;
        }
        .product-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-hover);
            border-color: var(--violet-light);
        }
        .product-img-wrap {
            position: relative;
            aspect-ratio: 1 / 1;
            background: var(--bg-soft);
            overflow: hidden;
        }
        .product-img-wrap img {
            width: 100%; height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .product-card:hover .product-img-wrap img {
            transform: scale(1.06);
        }
        .product-add {
            position: absolute;
            bottom: 10px; right: 10px;
            width: 36px; height: 36px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, var(--violet), var(--pink));
            color: #fff;
            font-size: 20px;
            line-height: 1;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 16px rgba(124,58,237,0.35);
            transition: transform 0.2s;
        }
        .product-add:active { transform: scale(0.88); }
        .product-info {
            padding: 12px 14px 16px;
        }
        .product-info h3 {
            font-size: 13px;
            font-weight: 600;
            line-height: 1.3;
            margin-bottom: 6px;
            color: var(--text);
        }
        .product-price {
            font-size: 15px;
            font-weight: 800;
            color: var(--violet);
        }
        .product-price-eur {
            font-size: 11px;
            color: var(--muted);
            margin-top: 2px;
        }
        .product-order {
            color: var(--pink);
            font-weight: 800;
        }

        /* FAQ */
        .faq-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 800px;
            margin: 0 auto;
        }
        .faq-item {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s;
        }
        .faq-item:hover { border-color: var(--violet-light); }
        .faq-q {
            padding: 18px 20px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }
        .faq-q::after {
            content: '+';
            font-size: 20px;
            color: var(--violet);
            font-weight: 300;
            transition: transform 0.3s;
        }
        .faq-item.open .faq-q::after { transform: rotate(45deg); }
        .faq-a {
            max-height: 0;
            overflow: hidden;
            padding: 0 20px;
            font-size: 12px;
            color: var(--muted);
            line-height: 1.6;
            transition: all 0.3s;
        }
        .faq-item.open .faq-a {
            max-height: 300px;
            padding: 0 20px 18px;
        }

        /* НИЖНЯЯ ПАНЕЛЬ */
        .bottom-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(255,255,255,0.98);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            padding: 14px 20px;
            display: flex; align-items: center; justify-content: space-between;
            z-index: 60;
            box-shadow: 0 -4px 20px rgba(124,58,237,0.08);
        }
        .bottom-info {
            font-size: 12px;
            color: var(--muted);
        }
        .bottom-info b {
            color: var(--violet);
            font-weight: 700;
        }
        .bottom-btn {
            background: linear-gradient(135deg, var(--violet), var(--pink));
            color: #fff;
            border: none;
            padding: 12px 24px;
            font-size: 11px;
            font-w
